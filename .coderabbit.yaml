# CodeRabbit Configuration
# Documentation: https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en"

early_access: false

reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Review for Python best practices, type hints, and ML/AI patterns.
        Check for proper error handling and logging.
        Ensure medical AI code follows safety-critical coding standards.
        Verify quantum computing implementations are correct.

    - path: "src/models/**/*.py"
      instructions: |
        Focus on model architecture correctness and efficiency.
        Check for proper initialization, forward pass logic, and loss functions.
        Verify multi-modal fusion strategies are sound.

    - path: "src/data/**/*.py"
      instructions: |
        Review data preprocessing pipelines for correctness.
        Check for data leakage between train/test splits.
        Ensure proper handling of medical imaging data (HIPAA considerations).

    - path: "tests/**/*.py"
      instructions: |
        Ensure comprehensive test coverage.
        Check for proper assertions and edge case handling.
        Verify mocking is used appropriately for external dependencies.

    - path: "*.yml"
      instructions: |
        Validate YAML syntax and structure.
        Check for security best practices in CI/CD pipelines.

    - path: "Dockerfile"
      instructions: |
        Review for Docker best practices and security.
        Check for minimal image size and proper layer caching.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
